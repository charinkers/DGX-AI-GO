<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>飞行机器人 IP · 虚拟预览</title>
<style>
  :root{
    --bg:#F5F8FC; --card:#FFFFFF; --ink:#1a2b4a; --muted:#5a6b85;
    --line:#d7e0ee; --accent:#534AB7;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--ink);padding:24px}
  h1{font-size:20px;margin:0 0 4px}
  .sub{color:var(--muted);font-size:13px;margin:0 0 20px}
  .layout{display:flex;gap:24px;flex-wrap:wrap;align-items:flex-start}
  .stage{background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:16px;flex:1 1 320px;min-width:300px}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:18px;flex:1 1 300px;min-width:280px}
  .row{margin-bottom:16px}
  label{display:block;font-size:13px;font-weight:500;margin-bottom:6px}
  input[type=text],select{width:100%;padding:8px 10px;border:1px solid var(--line);
    border-radius:8px;font-size:13px;background:#fff}
  input[type=range]{width:100%}
  .swatch{display:flex;gap:8px;flex-wrap:wrap}
  .sw{width:28px;height:28px;border-radius:50%;border:2px solid #fff;
    box-shadow:0 0 0 1px var(--line);cursor:pointer}
  .sw.on{box-shadow:0 0 0 2px var(--accent)}
  button{margin-top:6px;background:var(--accent);color:#fff;border:0;
    padding:9px 14px;border-radius:8px;font-size:13px;cursor:pointer}
  .config{margin-top:20px;background:#0c1424;color:#cfe; border-radius:12px;
    padding:14px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;
    white-space:pre-wrap;line-height:1.5}
  .hint{font-size:12px;color:var(--muted);margin-top:8px}
  /* —— 社区画廊 —— */
  .community{margin-top:28px}
  .community h2{font-size:16px;margin:0 0 4px}
  .community .csub{color:var(--muted);font-size:13px;margin:0 0 14px}
  .pubbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
  .pubbar input[type=text]{width:auto;flex:1 1 180px}
  .pubbar .chk{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
  .gcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;
    display:flex;flex-direction:column;gap:8px}
  .gthumb{height:96px;border-radius:10px;display:flex;align-items:center;justify-content:center;
    font-size:34px;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.25)}
  .gtitle{font-weight:600;font-size:14px}
  .gauthor{color:var(--muted);font-size:12px}
  .grow{display:flex;justify-content:space-between;align-items:center}
  .like{background:var(--accent);color:#fff;border:0;border-radius:18px;padding:5px 11px;
    cursor:pointer;font-size:13px}
  .like:disabled{opacity:.6;cursor:default}
  .badge{font-size:11px;padding:2px 8px;border-radius:10px;background:#eee;color:#666}
  .badge.pub{background:#e6f7ec;color:#1f9d55}
  .badge.priv{background:#fdeaea;color:#c0392b}
  .toggle{background:#eef1f8;border:1px solid var(--line);border-radius:8px;padding:5px 10px;
    font-size:12px;cursor:pointer;color:var(--ink)}
</style>
</head>
<body>
  <h1>AI造物 · 儿童机器人表达层</h1>
  <p class="sub">儿童机器人创想实践平台 · 表达层最小可跑版（无 GPU / 无 key / 浏览器直接开）— 设计你的伙伴，再发布到社区，给同龄人的创造点个赞</p>

  <div class="layout">
    <div class="stage">
      <svg id="bot" viewBox="0 0 300 320" width="100%" xmlns="http://www.w3.org/2000/svg">
        <!-- 螺旋桨 -->
        <rect x="144" y="34" width="12" height="20" rx="3" fill="#9aa6bd"/>
        <ellipse id="prop" cx="150" cy="28" rx="46" ry="7" fill="#b9c4d8"/>
        <!-- 翅膀（由 JS 切换 d） -->
        <path id="wingL" d="" fill-opacity="0.55" stroke="#3C3489" stroke-width="1"/>
        <path id="wingR" d="" fill-opacity="0.55" stroke="#3C3489" stroke-width="1"/>
        <!-- 身体 -->
        <ellipse id="body" cx="150" cy="170" rx="58" ry="64" fill="#7F77DD"/>
        <!-- 脸：眼睛 + 电量 -->
        <circle cx="128" cy="158" r="15" fill="#fff"/>
        <circle cx="172" cy="158" r="15" fill="#fff"/>
        <circle id="pupL" cx="128" cy="158" r="6" fill="#1a2b4a"/>
        <circle id="pupR" cx="172" cy="158" r="6" fill="#1a2b4a"/>
        <text id="battL" x="128" y="162" text-anchor="middle" font-size="11" fill="#1a2b4a">80</text>
        <text id="battR" x="172" y="162" text-anchor="middle" font-size="11" fill="#1a2b4a">80</text>
        <path id="mouth" d="M132 188 Q150 202 168 188" fill="none" stroke="#1a2b4a" stroke-width="3" stroke-linecap="round"/>
        <!-- 口头禅气泡 -->
        <g id="bubble">
          <rect x="186" y="96" width="96" height="34" rx="10" fill="#fff" stroke="#3C3489" stroke-width="1"/>
          <text id="phrase" x="234" y="117" text-anchor="middle" font-size="11" fill="#1a2b4a">一起玩吧！</text>
        </g>
        <!-- 性格标签 -->
        <text id="tag" x="150" y="252" text-anchor="middle" font-size="13" fill="#3C3489" font-weight="500">活泼</text>
      </svg>
    </div>

    <div class="panel">
      <div class="row">
        <label>机身颜色</label>
        <div class="swatch" id="swatches"></div>
      </div>
      <div class="row">
        <label>翅膀形态</label>
        <select id="wing">
          <option value="round">圆翼</option>
          <option value="sharp">尖翼</option>
          <option value="butterfly">蝶翼</option>
        </select>
      </div>
      <div class="row">
        <label>性格</label>
        <select id="personality">
          <option value="lively">活泼</option>
          <option value="calm">沉稳</option>
          <option value="silly">呆萌</option>
        </select>
      </div>
      <div class="row">
        <label>口头禅</label>
        <input id="catchphrase" type="text" value="一起玩吧！" maxlength="12"/>
      </div>
      <div class="row">
        <label>电量 <span id="battVal">80</span>%</label>
        <input id="battery" type="range" min="0" max="100" value="80"/>
      </div>
      <button id="export">导出为 Skill 配置</button>
      <div class="hint">点导出后，下方 JSON 就是「孩子表达 → skill 配置」的最小编译结果，将来可写回 IP 层。</div>
    </div>
  </div>

  <div class="config" id="cfg">// 调完上面，点「导出为 Skill 配置」生成 JSON</div>

  <!-- 社区发布层：保存 / 分享 / 互相点赞 -->
  <section class="community">
    <h2>🎨 作品社区 · 把创造分享出去</h2>
    <p class="csub">好的社区本身就是激发创造、鼓励创造的地方。你可以把刚设计的伙伴发布出来，给同龄人的作品点个赞；也可以选择只保存给自己、不分享。</p>
    <div class="pubbar">
      <input id="cTitle" type="text" placeholder="给你的作品起个名字，比如「会保护我的小飞猫」">
      <label class="chk"><input id="cPublic" type="checkbox" checked> 分享到社区</label>
      <button id="cPublish">发布我的作品</button>
    </div>
    <div class="grid" id="gallery"><span class="hint">社区加载中…</span></div>
  </section>

<script>
  const PALETTE = ["#7F77DD","#1D9E75","#D85A30","#378ADD","#D4537E","#BA7517"];
  const TAGS = {lively:"活泼",calm:"沉稳",silly:"呆萌"};
  const WINGS = {
    round:      "M92 170 Q60 150 70 120 Q100 140 112 165 Z",
    sharp:      "M92 170 L52 120 L96 150 Z",
    butterfly:  "M92 170 Q50 130 64 100 Q92 120 110 160 Z"
  };
  const state = {color:PALETTE[0], wing:"round", personality:"lively", catchphrase:"一起玩吧！", battery:80};

  const $ = id => document.getElementById(id);

  function render(){
    $("body").setAttribute("fill", state.color);
    $("wingL").setAttribute("fill", state.color);
    $("wingR").setAttribute("fill", state.color);
    const d = WINGS[state.wing];
    $("wingL").setAttribute("d", d);
    $("wingR").setAttribute("d", d.replace(/M(\d+)/, (m,p)=>"M"+(300-+p)) ); // 右翼镜像
    $("phrase").textContent = state.catchphrase || "…";
    $("tag").textContent = TAGS[state.personality];
    $("battVal").textContent = state.battery;
    ["battL","battR"].forEach(k=>$(k).textContent = state.battery);
    const low = state.battery < 25;
    $("battL").setAttribute("fill", low? "#A32D2D":"#1a2b4a");
    $("battR").setAttribute("fill", low? "#A32D2D":"#1a2b4a");
  }

  // 颜色色板
  const sw = $("swatches");
  PALETTE.forEach((c,i)=>{
    const el = document.createElement("div");
    el.className = "sw" + (i===0?" on":"");
    el.style.background = c;
    el.onclick = ()=>{
      state.color = c;
      [...sw.children].forEach(x=>x.classList.remove("on"));
      el.classList.add("on");
      render();
    };
    sw.appendChild(el);
  });

  $("wing").onchange = e=>{state.wing=e.target.value; render();};
  $("personality").onchange = e=>{state.personality=e.target.value; render();};
  $("catchphrase").oninput = e=>{state.catchphrase=e.target.value; render();};
  $("battery").oninput = e=>{state.battery=+e.target.value; render();};

  $("export").onclick = ()=>{
    const cfg = {
      ip: "flying-robot",
      custom_by: "child",
      color: state.color,
      wing: state.wing,
      personality: state.personality,
      catchphrase: state.catchphrase,
      battery: state.battery,
      generated_at: new Date().toISOString()
    };
    $("cfg").textContent = JSON.stringify(cfg, null, 2);
  };

  // ----------------------------------------------------------------------
  // 社区发布层：与 community/server.py 的本地 API 对接
  // 本地优先：数据存本机 community/data/works.json，不出本地、不联网
  // ----------------------------------------------------------------------
  const COMMUNITY_API = "http://localhost:8090";
  const myWorks = new Set();           // 本会话发布的作品 id，用于显示「私有/公开」切换
  const $c = id => document.getElementById(id);

  // 把当前表现层状态编译成统一设计契约（与 robot-design.schema.json 同源）
  function buildContract(){
    return {
      ip_id: "child-design-" + Date.now(),
      appearance: { body_color: state.color, wing_type: state.wing },
      personality: { type: state.personality },
      expression: { catchphrase: state.catchphrase },
      battery: { percent: state.battery }
    };
  }
  function thumbColor(w){
    const c = w.contract && (w.contract.appearance?.body_color || w.contract.color);
    return c || w.color || "#534AB7";
  }
  async function loadGallery(){
    const g = $c("gallery");
    try{
      const r = await fetch(COMMUNITY_API + "/api/works");
      if(!r.ok) throw new Error("社区服务未启动");
      const list = await r.json();
      if(!list.length){ g.innerHTML = '<span class="hint">还没有公开作品，发布第一个吧！</span>'; return; }
      g.innerHTML = "";
      list.forEach(w=>{
        const card = document.createElement("div");
        card.className = "gcard";
        const mine = myWorks.has(w.id);
        card.innerHTML = `
          <div class="gthumb" style="background:${thumbColor(w)}">🤖</div>
          <div class="gtitle">${escapeHtml(w.title)}</div>
          <div class="gauthor">by ${escapeHtml(w.author)}</div>
          <div class="grow">
            <button class="like" data-id="${w.id}">❤️ ${w.likes}</button>
            <span class="badge ${w.public?'pub':'priv'}">${w.public?'分享中':'私有'}</span>
          </div>` + (mine ? `
          <button class="toggle" data-toggle="${w.id}" data-public="${w.public}">
            ${w.public?'转为仅自己保存':'改为分享到社区'}</button>` : "");
        g.appendChild(card);
      });
      g.querySelectorAll(".like").forEach(b=>b.onclick=()=>like(b.dataset.id));
      g.querySelectorAll(".toggle").forEach(b=>b.onclick=()=>togglePrivacy(b.dataset.toggle, b.dataset.public==="true"));
    }catch(e){
      g.innerHTML = '<span class="hint">社区服务未启动（先运行 `python community/server.py --port 8090`）。保存功能仍可在本地使用。</span>';
    }
  }
  function escapeHtml(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
  async function like(id){
    await fetch(COMMUNITY_API + "/api/works/" + id + "/like", {method:"POST",
      headers:{"Content-Type":"application/json"}, body:JSON.stringify({liker:"guest"})});
    loadGallery();
  }
  async function togglePrivacy(id, isPublic){
    await fetch(COMMUNITY_API + "/api/works/" + id + "/privacy", {method:"POST",
      headers:{"Content-Type":"application/json"}, body:JSON.stringify({public:!isPublic})});
    loadGallery();
  }
  $c("cPublish").onclick = async ()=>{
    const title = $c("cTitle").value.trim() || "我的机器人伙伴";
    const isPublic = $c("cPublic").checked;
    // 先导出配置，便于审计孩子表达了什么
    $("export").click();
    const r = await fetch(COMMUNITY_API + "/api/works", {method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ title, author:"我", public:isPublic, contract: buildContract() })});
    if(r.ok){
      const w = await r.json();
      myWorks.add(w.id);
      $c("cTitle").value = "";
      loadGallery();
      alert(isPublic ? "已分享到社区 🎉 去看看大家的点赞吧！" : "已保存为私有作品（仅自己可见）。");
    }else{
      alert("发布失败：社区未启动或网络不可用。设计已通过上方 JSON 保存在本地。");
    }
  };
  loadGallery();

  render();
</script>
</body>
</html>
